name: Publish npm packages with provenance

on:
  workflow_call:
    inputs:
      plan:
        description: The dist release plan supplied by the generated workflow.
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        description: Optional bootstrap token; remove after trusted publishing is configured.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish shipped npm packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download packed npm artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-npm-packages
          path: target/npm-packages

      - name: Re-verify packed package contracts
        run: >-
          node npm/scripts/verify-packages.mjs
          --packages target/npm-packages

      - name: Publish platform packages, then @jiayanzeng/vibescan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          node npm/scripts/publish-packages.mjs
          --packages target/npm-packages
          --publish
