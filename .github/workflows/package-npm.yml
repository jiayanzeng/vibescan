name: Package and smoke-test npm release artifacts

on:
  workflow_call:
    inputs:
      plan:
        description: The dist release plan supplied by the generated workflow.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package shipped npm binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Download all platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: artifacts
          merge-multiple: true

      - name: Verify source package contracts
        run: npm --prefix npm test

      - name: Pack main and platform packages
        run: >-
          node npm/scripts/build-packages.mjs
          --artifacts artifacts
          --out target/npm-packages

      - name: Verify packed package contracts
        run: >-
          node npm/scripts/verify-packages.mjs
          --packages target/npm-packages

      - name: Upload npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-npm-packages
          path: |
            target/npm-packages/*.tgz
            target/npm-packages/packages.json

  smoke:
    name: npm smoke (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Download npm package tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-npm-packages
          path: target/npm-packages

      - name: Install without scripts and exercise npx
        run: >-
          node npm/scripts/smoke-packages.mjs
          --packages target/npm-packages
          --target ${{ matrix.target }}
